<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MídiaGamer BR | Loja de Games</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="titulo-site">
            <h1>MídiaGamer BR</h1>
            <p>Sua próxima aventura começa aqui.</p>
        </div>

        <div class="area-pesquisa">
            <input
               type="text"
               id="campo-busca"
               placeholder="Buscar um jogo..."
            >
        </div>

        <div class="acoes-usuario">
            <button 
                class="perfil_usuario" 
                id="perfil_usuario"
                title="Perfil"
                >
                👤
            </button>
            <button 
                class="carrinho_compra" 
                id="carrinho_compra"
                title="Carrinho"
                >
                🛒
                <span id="contador-carrinho">0</span>
            </button>
        </div>
    </header>

    <main>
        <section class="catalogo">
            <h2>Jogos em destaque</h2>

            <div class="barra-filtros">
                <div>
                    <h3>Gênero</h3>
                    <div class="filtros-genero">
                        <button type="button">Todos</button>
                        <button type="button">Ação</button>
                        <button type="button">Aventura</button>
                        <button type="button">Tiro</button>
                        <button type="button">Corrida</button>
                    </div>
                </div>

                <div>
                    <h3>Disponibilidade</h3>
                    <select id="filtro-estoque">
                        <option value="todos">Todos os jogos</option>
                        <option value="disponiveis">Somente disponíveis</option>
                    </select>
                </div>

                <div>
                    <h3>Plataformas</h3>
                    <select id="filtro-plataforma">
                        <option value="todas">Todas as Plataformas</option>
                        <option value="pc">PC</option>
                        <option value="xbox">Xbox</option>
                        <option value="playstation">PlayStation</option>
                        <option value="nintendo">Nintendo</option>
                        <option value="wii">Wii</option>
                        <option value="switch">Switch</option>
                    </select>
                </div>
            </div>

            <div id="lista-jogos">
                <!-- Essa é a parte que ficam os jogos blz CaioX-->
            </div>
        </section>
    </main>

    <div id="modal-carrinho" class="modal-overlay escondido">
        <div class="modal-conteudo">
            <div class="modal-header">
                <h2>Seu Carrinho</h2>

                <button id="fechar-modal" class="btn-fechar">
                    &times;
                </button>
            </div>

            <div id="itens-carrinho" class="modal-body">
                <p>Seu carrinho está vazio.</p>
            </div>

            <div class="modal-footer">
                <p>
                    Total:
                    <strong id="total-carrinho">R$ 0,00</strong>
                </p>

                <button id="finalizar-compra" class="btn-finalizar">
                    Finalizar compra
                </button>
            </div>
        </div>
    </div>
    <div id="modal-perfil" class="modal-overlay escondido">
        <div class="modal-conteudo">
            <div class="modal-header">
                <h2>Login</h2>

                <button id="fechar-modal2" class="btn-fechar">
                    &times
                </button>
            </div>

            <div class="modal-body">
                Usuário
                Senha
            </div>

            <div class="modal-footer">
                <button id="finalizar-login" class="btn-finalizar">
                    Fazer login
                </button>
            </div>
            
        </div>
    </div>

    <footer>
        <h3>&copy; 2026 <span class="nome-midia">MídiaGamer BR</span>. Todos os direitos reservados.</h3>
        <p>Desenvolvido por <a href="https://github.com/Murilo5660" target="_blank" class="devs">Murilo Ferreira Stresser</a> e <a href="https://github.com/caio180" target="_blank" class="devs">Caio Lima Viana</a>.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
